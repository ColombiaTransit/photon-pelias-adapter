name: CI

# Tests on every push and pull request; on master also builds the image and
# publishes it to GitHub Container Registry:
#   ghcr.io/colombiatransit/photon-pelias-adapter:latest
#   ghcr.io/colombiatransit/photon-pelias-adapter:YYYYMMDD
#   ghcr.io/colombiatransit/photon-pelias-adapter:sha-<commit>

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/colombiatransit/photon-pelias-adapter

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: npm test

  image:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: date
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.date.outputs.date }}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the image
        run: |
          docker run -d --name adapter -p 8080:8080 -e PHOTON_URL=http://127.0.0.1:9 "${IMAGE}:latest"
          for _ in $(seq 1 20); do
            curl -fsS http://localhost:8080/health && break
            sleep 1
          done
          curl -fsS http://localhost:8080/health
          # Photon is unreachable here: the adapter must answer 502 without leaking the host.
          code=$(curl -s -o body.json -w '%{http_code}' "http://localhost:8080/v1/search?text=bogota")
          cat body.json
          test "$code" = "502"
          if grep -q "127.0.0.1" body.json; then echo "internal host leaked"; exit 1; fi
          docker rm -f adapter
